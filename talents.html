<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macula Talents — MACULA EGYPT</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body{margin:0;background:var(--bg,#08070b);color:var(--text,#fff);font-family:inherit}
.detail-wrap{width:min(1300px,calc(100% - 40px));margin:auto;padding:130px 0 100px}
.back{display:inline-flex;color:var(--muted,#999);text-decoration:none;margin-bottom:55px}
.kicker{font-size:11px;letter-spacing:3px;color:#ff1594;font-weight:900}
h1{font-size:clamp(50px,8vw,105px);line-height:.95;margin:18px 0}
.lead{max-width:760px;color:var(--muted,#999);font-size:18px;line-height:1.8}
.talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px;margin-top:65px}
.talent-card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:10px;overflow:hidden;transition:.3s;position:relative}
.talent-card:hover{transform:translateY(-7px);border-color:#ff1594;box-shadow:0 24px 55px rgba(255,21,148,.18)}
.talent-card img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center;display:block;border-radius:16px;background:transparent}
.talent-meta{padding:14px 8px 10px}.talent-meta h3{margin:0 0 6px;font-size:18px}.talent-meta p{margin:0;color:var(--muted,#aaa);font-size:12px}.talent-meta .arrow{margin-top:12px;color:#ff4cac;font-size:12px;font-weight:800}
.social{display:flex;gap:9px;flex-wrap:wrap;margin-top:55px}.social a{color:var(--text,#fff);text-decoration:none;border:1px solid var(--line,rgba(255,255,255,.1));padding:10px 15px;border-radius:999px;font-size:12px;font-weight:800}
</style></head><body>
<div class="detail-wrap">
<a class="back" href="index.html">← Back to Macula</a>
<span class="kicker">MACULA EGYPT</span>
<h1>Macula Talents.</h1>
<p class="lead">Every client has a dedicated 1000 × 1000 profile artwork, with the client image, profile information and available official social links on the detail page.</p>
<div class="talent-grid" id="talentGrid"></div>
<div class="social">
<a href="https://www.facebook.com/MaculaEgypt" target="_blank" rel="noopener">Facebook</a>
<a href="https://www.instagram.com/maculaegypt" target="_blank" rel="noopener">Instagram</a>
<a href="https://www.tiktok.com/@maculaegypt" target="_blank" rel="noopener">TikTok</a>
<a href="https://snapchat.com/t/ZptTEmix" target="_blank" rel="noopener">Snapchat</a>
</div></div>
<script src="assets/data.js"></script><script src="assets/live-talents.js"></script><script src="assets/main.js"></script>
<script>
const lang=localStorage.getItem('macula-lang-v2')||'en';
const grid=document.getElementById('talentGrid');
TALENTS.forEach(t=>{const a=document.createElement('a');a.className='talent-card';a.href='star.html?slug='+t.slug;a.innerHTML='<img src="'+t.photo+'" alt="'+t.name+'" loading="lazy"><div class="talent-meta"><h3>'+((lang==='ar')?t.nameAr:t.name)+'</h3><p>'+((lang==='ar')?t.roleAr:t.role)+'</p><div class="arrow">'+((lang==='ar')?'شوف التفاصيل ←':'View Profile →')+'</div></div>';grid.appendChild(a);});
</script></body></html>
